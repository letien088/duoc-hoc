<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: cho phép app tràn ra sát mép, rồi CSS dùng
     env(safe-area-inset-*) để né Dynamic Island và vạch Home -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dược &amp; Phác đồ</title>
<meta name="description" content="Sổ tay học dược chất, biệt dược, bệnh và phác đồ điều trị.">

<!-- Chạy như app thật khi đã Thêm vào MH chính -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dược &amp; Phác đồ">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="dau" class="dau"></header>

<main id="than" class="than">
  <div class="trang"><div class="trong"><p>Đang mở kho dữ liệu…</p></div></div>
</main>

<nav id="tab" class="tab"></nav>

<script>
/* Lưới an toàn cho lúc mã nguồn không nạp được.

   Cả app là một chuỗi module. Chỉ cần một tệp trong chuỗi không tải về —
   mạng chập một nhịp, hay bản cập nhật tải lên còn thiếu tệp — là trình duyệt
   lặng lẽ bỏ cuộc: không ném lỗi ra màn hình, không gọi hàm nào, và dòng chờ
   bên dưới nằm đó vĩnh viễn. Mọi lớp bảo vệ khác đều nằm trong chính cái tệp
   không tải về được, nên lớp này phải là script THƯỜNG, viết thẳng ở đây.

   js/app.js đặt window.__maDaNap = true ngay khi nạp xong. Cờ đó chỉ nói "mã
   đã về", không nói "đã mở xong kho dữ liệu" — phần đó app tự lo, có hạn giờ
   và màn hình lỗi riêng. */
(function () {
  var HAN = 10000;     // ms chờ trước khi kết luận là mã không về

  function hien(lyDo) {
    if (window.__maDaNap) return;
    var t = document.getElementById('than');
    if (!t || t.getAttribute('data-loi-nap')) return;
    t.setAttribute('data-loi-nap', '1');
    t.innerHTML =
      '<div class="trang"><div class="trong">'
      + '<div class="trong-icon">\uD83D\uDCE1</div>'
      + '<h3>Chưa tải được mã của app</h3>'
      + '<p>' + lyDo + '</p>'
      + '<p>Dữ liệu trong máy vẫn còn nguyên — chỉ phần mã chưa tải về.</p>'
      + '<div class="the-nut">'
      + '<button class="nut nut-chinh" id="nut-tai-lai">Tải lại</button>'
      + '<button class="nut" id="nut-don-dem">Dọn bộ nhớ đệm rồi tải lại</button>'
      + '</div></div></div>';
    document.getElementById('nut-tai-lai').onclick = function () { location.reload(); };
    document.getElementById('nut-don-dem').onclick = donRoiTai;
  }

  /* Bản cập nhật tải lên nửa chừng có thể nằm lại trong bộ nhớ đệm của app,
     và khi đó tải lại bình thường vẫn ra đúng bản hỏng đó. Nút này xoá bộ nhớ
     đệm và gỡ service worker rồi mới tải lại. KHÔNG đụng tới IndexedDB, nên
     dược chất, bệnh và phác đồ của bạn không suy suyển. */
  function donRoiTai() {
    var xong = function () { location.reload(); };
    try {
      var viec = [];
      if (window.caches && caches.keys) {
        viec.push(caches.keys().then(function (ds) {
          return Promise.all(ds.map(function (k) { return caches.delete(k); }));
        }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        viec.push(navigator.serviceWorker.getRegistrations().then(function (ds) {
          return Promise.all(ds.map(function (r) { return r.unregister(); }));
        }));
      }
      Promise.all(viec).then(xong, xong);
      setTimeout(xong, 4000);        // dọn mãi không xong thì cứ tải lại
    } catch (e) { xong(); }
  }

  /* Tệp script tải hỏng không nổi bọt lên window, phải bắt ở pha capture. */
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      hien('Không tải được một tệp mã. Kiểm tra mạng rồi thử lại.');
    }
  }, true);

  setTimeout(function () {
    hien('Mạng quá chậm, hoặc bản cập nhật vừa tải lên còn thiếu tệp.');
  }, HAN);
})();
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
